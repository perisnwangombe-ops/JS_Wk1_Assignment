<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="NavBar">
        <div class="container">
            <div>My Personal Site</div>
            <nav>
                <a href="#">home</a>
                <a href="#">about</a>
                <a href="#">contact</a>
            </nav>
        </div>
    </header>
    
    <section class="Hero">
        <div class="container"> <!-- Hero Title Section -->
            <div class="text-center mb-12 pt-10">
                <div class="inline-flex items-center gap-3 mb-4">
                    <i class="fas fa-star text-yellow-400 text-4xl"></i>
                    <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">
                    Welcome to My World</h1>
                </div>

            <p class="text-gray-600 text-lg">
                A personalized interactive experience just for you
            </p>
        </div>

        <!-- have image or info about you / A section to display the personalized greeting. -->
        
    </div>
</section>

    <section  class="contact-section">
        <div class="contact-grid">
            <div class="contact-form">  <!-- right side of the form -->
                <h2>Access Section </h2>
                <form action="#" method="post">   <!-- A form for collecting the user's name and age.-->
                    <div class="form-group">
                        <label for="fullname">Full Name :</label>
                        <input type="text" id="fullname" name="fullname"  placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age"  placeholder="Your Age" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" > Save Infromation  </button>
                    </div>
                </form>

            </div>  
                                                                
        <div id="displaySection" class="hidden">                                    <!-- Display Section -->
            <button onclick="clearData()" class="clear-btn">Clear Data</button>
            <h2 id="greeting"></h2>
            <div class="info-box">
                <p>Your age in months:</p>
                <h3 id="ageMonths"></h3>
            </div>
            <div id="adultSection" class="info-box"></div>
            <div class="quotes-section">
                <h3>Motivational Quotes (5 times)</h3>
                <div id="quotesContainer"></div>
            </div>
        </div>
        
       </div> 
    </section>
   
    
<script src="script.js"></script>
</body>
</html>
