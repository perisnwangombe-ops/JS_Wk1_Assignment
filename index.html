
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Site</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="NavBar">
        <div class="container">
            <div>My Personal Site</div>
            <nav>
                <a href="#">home</a>
                <a href="#">about</a>
                <a href="#">contact</a>
            </nav>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container text-center pt-10">
            <div class="inline-flex items-center gap-3 mb-4">
                <i class="fas fa-star text-yellow-400 text-4xl"></i>

                <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r 
                           from-indigo-600 to-purple-600">
                    Welcome to My World
                </h1>
            </div>

            <p class="text-gray-600 text-lg">
                A personalized interactive experience just for you
            </p>
        </div>
    </section>

    <!-- CONTACT / FORM SECTION -->
    <section class="contact-section">
        <div class="contact-grid">

            <!-- Form Wrapper -->
            <div id="formSection" class="contact-form">
                <h2>Tell Me About Yourself</h2>

                <form id="userForm">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" placeholder="Your age" required>
                    </div>

                    <button type="submit">Save Information</button>
                </form>
            </div>

            <!-- DISPLAY SECTION -->
            <div id="displaySection" class="hidden">
                <button onclick="clearData()" class="clear-btn">Clear Data</button>

                <h2 id="greeting"></h2>

                <div class="info-box">
                    <p>Your age in months:</p>
                    <h3 id="ageMonths"></h3>
                </div>

                <div id="adultSection" class="info-box"></div>

                <div class="quotes-section">
                    <h3>Motivational Quotes (5 times)</h3>
                    <div id="quotesContainer"></div>
                </div>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
